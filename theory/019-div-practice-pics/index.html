<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Котомемемоизация</title>
    <style>
        body {
            margin: 0px;
            background-color: #000;
            font-family: monospace;
        }

        .meme-container {

            padding-top: 20px;
            color: #fff;
            border: 10px solid white;
            font-size: 20px;
        }

        .meme-image {
            display: block;
            margin: 0 auto;
            width: 320px;
            height: 240px;
            border: 3px solid white;
        }

        p {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="meme-container">
        <img src="https://aleatori.cat/random" alt="Котэ" class="meme-image">
        <p>Я — КОТ<br>
            А какие достижения у тебя?</p>
    </div>

</body>

</html>
